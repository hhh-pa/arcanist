# The Go CI-tools are black-box tested (golden tests execute compiled
# binaries as subprocesses), so a Go coverprofile structurally
# under-reports and would only pollute the Rust numbers. Their gate
# is `go test` itself, not coverage: exclude the whole module from
# coverage accounting.
ignore:
  - "scripts/ci/go/**"

# T1170 endgame: the suite plus LCOV exclusions must hold every line
# covered. Both gates pin 100% so any regression fails loudly.
coverage:
  status:
    project:
      default:
        target: 100%
    patch:
      default:
        target: 100%
