[package]
name = "arcanist-rs"
version = "0.3.0"
edition = "2024"
description = "Rust port of Arcanist (arc)"
license = "Apache-2.0"
homepage = "https://github.com/hhh-pa/arcanist"
repository = "https://github.com/hhh-pa/arcanist"
keywords = ["arcanist", "phabricator", "cli"]
autobins = false

# T1181: the lib keeps its historical `arc_rs` target name so the
# package rename needs no source changes (73 files use `arc_rs::`).
[lib]
name = "arc_rs"
path = "src/lib.rs"

[[bin]]
name = "arc"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
flate2 = "1"
regex = "1"
reqwest = { version = "0.12", features = ["blocking"] }
rsa = "0.9"
serde_json = { version = "1", features = ["preserve_order"] }
tar = "0.4"
sha1 = { version = "0.10", features = ["oid"] }

# Concurrency model checker (T1176 MC): enabled only by the loom CI job
# via `--features loom`. Optional (never in default builds). A cargo
# feature, not `--cfg loom`, which would leak into dependencies like
# hyper-util and break their builds.
loom = { version = "0.7", optional = true }

[features]
loom = ["dep:loom"]

# Deny the `unused` lint group (unused_mut, dead_code, unused_imports,
# ...) package-wide, on every platform/profile/target. Clippy's `-D
# warnings` only runs on Linux, so without this Windows-only dead code
# (T1170: lint_csharp's conditional `mut`, the Unix-only CHMOD consts)
# compiles with warnings that no gate catches. Applies to this package
# only, never to dependencies.
[lints.rust]
unused = "deny"
