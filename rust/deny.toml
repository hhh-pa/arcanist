# cargo-deny policy, imported from github-io (T1128). Advisories are covered
# by cargo-audit instead (same RustSec DB), so there is intentionally no
# [advisories] section; CI runs `cargo deny check licenses bans sources`.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    # T1153: serde_json "preserve_order" (server-order fidelity, RB-D26)
    # pulls foldhash via indexmap; Zlib is OSI-approved and FSF-free.
    "Zlib",
]
[licenses.private]
ignore = true
[bans]
multiple-versions = "deny"
# wildcards = allow, mirroring github-io: duplicate versions (the costly
# half of bans) are still denied above.
wildcards = "allow"
skip = [
    # Baseline duplicates at T1128 adoption: all but the newest line per
    # crate, at minor precision so patch bumps don't stale them. Drop
    # entries as dependents unify.
    "base64@0.22",
    "core-foundation@0.9",
    "getrandom@0.2",
    "syn@2.0",
]
[sources]
unknown-registry = "deny"
unknown-git = "deny"
