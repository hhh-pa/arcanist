name: rust

on:
  push:
    paths:
      - "rust/**"
      - "scripts/ci/**"
      - ".dockerignore"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "scripts/ci/**"
      - ".dockerignore"
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  quality-gates:
    name: quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # checkout
      actions: write # coverage artifact + GHA image cache
      pull-requests: write # sticky coverage comment
    env:
      # Image repo for the cached gate image (public, so pulls stay
      # anonymous). Override with the GATE_IMAGE repo variable; pushes need
      # the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets (a PAT with
      # read+write on the namespace). Without the token the image builds
      # local-only and the gates still run (fork PRs stay green, slower).
      GATE_IMAGE: ${{ vars.GATE_IMAGE || 'hhhpa/arcanist' }}
    steps:
      - uses: actions/checkout@v4
      # Cache key: every input the image depends on. A hit pulls the image
      # and runs the gates in it; a miss rebuilds, pushes, then runs.
      - name: compute image key
        run: |
          key="${{ hashFiles('rust/Cargo.lock', 'scripts/ci/quality-gates.Dockerfile', 'scripts/ci/lib/*.py') }}"
          echo "GATE_KEY=$key" >> "$GITHUB_ENV"
          echo "Gate image: $GATE_IMAGE:$key"
      - name: pull gate image
        id: pull
        continue-on-error: true
        run: docker pull "$GATE_IMAGE:$GATE_KEY"
      - name: set up buildx
        if: steps.pull.outcome == 'failure'
        uses: docker/setup-buildx-action@v3
      # `secrets` is unusable in `if:`, so probe it in `run:` and gate on
      # the output instead.
      - name: check docker hub credentials
        id: creds
        if: steps.pull.outcome == 'failure'
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: docker hub login
        if: steps.pull.outcome == 'failure' && steps.creds.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build gate image
        if: steps.pull.outcome == 'failure'
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            docker buildx build --push --cache-from type=gha --cache-to type=gha,mode=max \
              -t "$GATE_IMAGE:$GATE_KEY" -f scripts/ci/quality-gates.Dockerfile .
          else
            echo '::warning::DOCKERHUB_TOKEN not set; gate image stays local.'
            docker buildx build --load --cache-from type=gha --cache-to type=gha,mode=max \
              -t "$GATE_IMAGE:$GATE_KEY" -f scripts/ci/quality-gates.Dockerfile .
          fi
      - name: run quality gates
        run: docker run --rm -v "${{ github.workspace }}:/work" -w /work "$GATE_IMAGE:$GATE_KEY" python3 scripts/ci/lib/rust-quality-gates.py rust rust/target/llvm-cov nextest --run-ignored all --no-fail-fast
      # The container runs as root; hand the report back so later steps can
      # read it.
      - name: take ownership of coverage report
        if: always()
        run: |
          if [ -d rust/target/llvm-cov ]; then
            sudo chown -R "$(id -u):$(id -g)" rust/target/llvm-cov
          fi
      - name: publish coverage summary
        if: always()
        run: python3 scripts/ci/lib/coverage-summary.py --out rust/target/llvm-cov/coverage-comment.md rust/target/llvm-cov/lcov.info >> "$GITHUB_STEP_SUMMARY"
      - name: upload coverage report
        if: always() && hashFiles('rust/target/llvm-cov/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: rust/target/llvm-cov/
          retention-days: 30
      - name: coverage PR comment
        if: always() && github.event_name == 'pull_request' && hashFiles('rust/target/llvm-cov/coverage-comment.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: rust/target/llvm-cov/coverage-comment.md
          skip_unchanged: true
      - name: upload coverage to codecov
        if: always() && hashFiles('rust/target/llvm-cov/lcov.info') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rust/target/llvm-cov/lcov.info
          fail_ci_if_error: false
      - name: upload test results to codecov
        if: ${{ !cancelled() }} && hashFiles('rust/target/llvm-cov/junit.xml') != ''
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rust/target/llvm-cov/junit.xml
          fail_ci_if_error: false

  build-release:
    name: release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: smoke-test shipped binary
        shell: bash
        run: |
          set -o pipefail
          bin=target/release/arc
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="$bin.exe"
          fi
          test -x "$bin"
          "$bin" --help | grep -q 'usage:'
