name: rust

on:
  push:
    paths:
      - "rust/**"
      - "scripts/ci/**"
      - ".dockerignore"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "scripts/ci/**"
      - ".dockerignore"
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  quality-gates:
    name: quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Public image repo for the cached gate image. Override the namespace
      # with the DOCKERHUB_NAMESPACE repo variable; pushes need the
      # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets (a namespace PAT with
      # read+write). Without the token the image builds local-only and the
      # gates still run (fork PRs stay green, just slower).
      GATE_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || 'm-hu' }}/arcanist-quality-gates
    steps:
      - uses: actions/checkout@v4
      # Cache key: every input the image depends on. A hit pulls the image
      # and runs the gates in it; a miss rebuilds, pushes, then runs.
      - name: compute image key
        run: echo "GATE_KEY=${{ hashFiles('rust/Cargo.lock', 'scripts/ci/quality-gates.Dockerfile', 'scripts/ci/lib/*.py') }}" >> "$GITHUB_ENV"
      - name: pull gate image
        id: pull
        continue-on-error: true
        run: docker pull "$GATE_IMAGE:$GATE_KEY"
      - name: set up buildx
        if: steps.pull.outcome == 'failure'
        uses: docker/setup-buildx-action@v3
      # `secrets` is unusable in `if:`, so probe it in `run:` and gate on
      # the output instead.
      - name: check docker hub credentials
        id: creds
        if: steps.pull.outcome == 'failure'
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: docker hub login
        if: steps.pull.outcome == 'failure' && steps.creds.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build gate image
        if: steps.pull.outcome == 'failure'
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            docker buildx build --push --cache-from type=gha --cache-to type=gha,mode=max \
              -t "$GATE_IMAGE:$GATE_KEY" -f scripts/ci/quality-gates.Dockerfile .
          else
            echo '::warning::DOCKERHUB_TOKEN not set; gate image stays local.'
            docker buildx build --load --cache-from type=gha --cache-to type=gha,mode=max \
              -t "$GATE_IMAGE:$GATE_KEY" -f scripts/ci/quality-gates.Dockerfile .
          fi
      - name: run quality gates
        run: docker run --rm -v "${{ github.workspace }}:/work" -w /work "$GATE_IMAGE:$GATE_KEY" python3 scripts/ci/lib/rust-quality-gates.py rust rust/target/llvm-cov nextest --run-ignored all --no-fail-fast

  build-release:
    name: release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
