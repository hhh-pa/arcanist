name: release

# Pushing a `v*` tag builds the `arc` release binary on Linux, macOS,
# and Windows, attaches the archives to the GitHub release of the
# same name (the download page), and publishes `arcanist-rs` to
# crates.io (OIDC trusted publishing — the repo must be registered as
# a trusted publisher for the crate). `workflow_dispatch` runs the
# same builds without publishing, as a dry run.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Least privilege: jobs inherit read-only; artifact upload and
# release publishing widen their own job below.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # checkout
      actions: write # artifact upload
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}
      - uses: dtolnay/rust-toolchain@stable
      # Cargo registry + target/ cache (T1170): warm runs skip crate
      # downloads and reuse prior compilation. `save-if` forces a save
      # on branch runs too, so the second push already hits.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: 'true'
      - run: cargo build --release --locked
      - name: package binary
        run: |
          set -euo pipefail
          target=$(rustc -vV | sed -n 's/^host: //p')
          bin=target/release/arc
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="$bin.exe"
          fi
          test -x "$bin"
          "$bin" --help | grep -q 'usage:'
          mkdir -p dist
          asset="dist/arc-$target.tar.gz"
          tar -czf "$asset" -C target/release "$(basename "$bin")"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
        id: package
      - uses: actions/upload-artifact@v6
        with:
          name: arc-${{ steps.package.outputs.target }}
          path: rust/dist/arc-*.tar.gz
          if-no-files-found: error

  publish:
    name: publish to GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the GitHub release
      actions: write # artifact download (same-repo scope)
    steps:
      # gh release needs the git remote (and full history + tags for
      # --generate-notes); download-artifact alone leaves no checkout.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: attach archives to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ls dist
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload --clobber "$tag" dist/arc-*.tar.gz
          else
            gh release create "$tag" --generate-notes dist/arc-*.tar.gz
          fi

  crates-publish:
    name: publish to crates.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      id-token: write # crates.io trusted publishing (OIDC)
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: 'true'
      # Exchanges the OIDC token for a short-lived crates.io token
      # (auto-revoked when the job completes); no stored secret.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: publish arcanist-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
