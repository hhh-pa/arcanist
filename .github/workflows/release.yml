name: release

# Pushing a `v*` tag builds the `arc` release binary on Linux, macOS,
# and Windows and attaches the archives to the GitHub release of the
# same name (the download page). `workflow_dispatch` runs the same
# builds without publishing, as a dry run.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Least privilege: jobs inherit read-only; artifact upload and
# release publishing widen their own job below.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # checkout
      actions: write # artifact upload
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: package binary
        run: |
          set -euo pipefail
          target=$(rustc -vV | sed -n 's/^host: //p')
          bin=target/release/arc
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="$bin.exe"
          fi
          test -x "$bin"
          "$bin" --help | grep -q 'usage:'
          mkdir -p dist
          asset="dist/arc-$target.tar.gz"
          tar -czf "$asset" -C target/release "$(basename "$bin")"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
        id: package
      - uses: actions/upload-artifact@v4
        with:
          name: arc-${{ steps.package.outputs.target }}
          path: rust/dist/arc-*.tar.gz
          if-no-files-found: error

  publish:
    name: publish to GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the GitHub release
      actions: write # artifact download (same-repo scope)
    steps:
      # gh release needs the git remote (and full history + tags for
      # --generate-notes); download-artifact alone leaves no checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: attach archives to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ls dist
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload --clobber "$tag" dist/arc-*.tar.gz
          else
            gh release create "$tag" --generate-notes dist/arc-*.tar.gz
          fi
