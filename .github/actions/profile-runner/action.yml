name: profile-runner
description: >
  Log the runner's hardware profile (CPU, memory, storage) to the step log
  and the job summary, so per-execution performance can be understood
  (T1170 PROF). Runs the in-repo Go profiler from a prebuilt binary kept
  in the Actions cache (rebuilt on miss, like ci-tools); no external
  dependencies beyond setup-go.
inputs:
  cache-key:
    description: >
      Full cache key for the prebuilt profiler binary, shared by every
      job on the OS: runner-profile-<os>-<hash>, where the hash covers
      this action's sources plus exactly the Go inputs the build reads
      (go.mod, cmd/runner-profile, internal/executil), e.g.
      runner-profile-ubuntu-a1b2c3. One entry per OS serves all jobs
      (like ci-tools); unrelated Go tool changes no longer invalidate
      it, while the action hash re-keys automatically whenever this
      manifest changes, so stale entries from older designs can never
      shadow a fresh build. (Callers build the key from the runner and
      hashFiles contexts, which exist in workflows but not in this
      manifest.)
    required: true
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v5
      with:
        # The whole dir: the file inside is runner-profile(.exe)
        # depending on the OS, and a dir path sidesteps that.
        # Relative on purpose: an absolute workspace path fails
        # post-save validation ("Path(s) ... do(es) not exist",
        # CI-proven). Relative resolves against the workspace for the
        # main step (hits extract to WS/profiler-bin, CI-proven) and
        # for the post step only in the saver manifest shape below.
        path: profiler-bin
        key: ${{ inputs.cache-key }}
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@v6
      with:
        go-version-file: scripts/ci/go/go.mod
        cache: false
    # NOTE: never expand ${{ github.workspace }} inside run: scripts —
    # on Windows it is a backslash path that bash mangles. Relative
    # paths plus the quoted $GITHUB_WORKSPACE env (bash-safe) only;
    # working-directory (handled natively by the runner, not bash)
    # stays absolute.
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/scripts/ci/go
      run: CGO_ENABLED=0 go build -o ../../profiler-bin/runner-profile ./cmd/runner-profile
    # NO working-directory here — deliberate, and load-bearing for the
    # cache post step. History, all CI-proven:
    # - split build/run with a RELATIVE invocation 127'd on misses:
    #   implicit-cwd steps execute at the caller's job-default
    #   (rust/ here), where ./profiler-bin/ does not exist;
    # - merged single step plus an explicit-workspace trailer fixed the
    #   127 but the post step warned ("do(es) not exist") and never
    #   saved on any job;
    # - this saver shape (explicit build, implicit absolute run) saved
    #   on the only run that ever saved (fmt, run 39050345211).
    # So: the post step resolves `profiler-bin` against the workspace
    # only when an implicit-cwd run step exists; the invocation stays
    # absolute via the quoted $GITHUB_WORKSPACE env (double quotes keep
    # Windows backslashes literal, so bash cannot mangle them). DO NOT add
    # working-directory here, and DO NOT make the invocation relative,
    # without re-proving post-save on all three OSes.
    - name: profile runner hardware
      shell: bash
      run: "$GITHUB_WORKSPACE/profiler-bin/runner-profile"
