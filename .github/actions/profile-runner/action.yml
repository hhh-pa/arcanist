name: profile-runner
description: >
  Log the runner's hardware profile (CPU, memory, storage) to the step log
  and the job summary, so per-execution performance can be understood
  (T1170 PROF). Runs the in-repo Go profiler from a prebuilt binary kept
  in the Actions cache (rebuilt on miss, like ci-tools); no external
  dependencies beyond setup-go.
inputs:
  cache-key:
    description: >
      Full cache key for the prebuilt profiler binary, shared by every
      job on the OS: runner-profile-<os>-<hash>, where the hash covers
      this action's sources plus exactly the Go inputs the build reads
      (go.mod, cmd/runner-profile, internal/executil), e.g.
      runner-profile-ubuntu-a1b2c3. One entry per OS serves all jobs
      (like ci-tools); unrelated Go tool changes no longer invalidate
      it, while the action hash re-keys automatically whenever this
      manifest changes, so stale entries from older designs can never
      shadow a fresh build. (Callers build the key from the runner and
      hashFiles contexts, which exist in workflows but not in this
      manifest.)
    required: true
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v5
      with:
        # The whole dir: the file inside is runner-profile(.exe)
        # depending on the OS, and a dir path sidesteps that.
        # Relative on purpose: `uses:` steps resolve against the
        # workspace (not the caller's job-default cwd — proven by real
        # saves), while an absolute workspace path fails post-save
        # validation ("Path(s) ... do(es) not exist", CI-proven).
        path: profiler-bin
        key: ${{ inputs.cache-key }}
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@v6
      with:
        go-version-file: scripts/ci/go/go.mod
        cache: false
    # NOTE: never expand the workspace path inside run: scripts — on
    # Windows it is a backslash path that bash mangles into nonsense.
    # Relative paths only here; working-directory (handled natively by
    # the runner, not bash) stays absolute.
    #
    # Build and run share ONE step (same cwd, guaranteed): split steps
    # resolved profiler-bin/ against different directories depending on
    # the caller's job-default cwd, so cache misses always failed with
    # 127 while hits worked. The cache-hit output crosses the step
    # boundary via env (steps context is unavailable to run: scripts'
    # shell, but expressions are allowed in env:).
    - name: profile runner hardware
      shell: bash
      working-directory: ${{ github.workspace }}/scripts/ci/go
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        if [ "$CACHE_HIT" != 'true' ]; then
          CGO_ENABLED=0 go build -o ../../profiler-bin/runner-profile ./cmd/runner-profile
        fi
        ../../profiler-bin/runner-profile
    # Trailer: no-op run step declaring the workspace, so the cache
    # post step resolves `profiler-bin` against it (empirically the
    # post inherits the last run step's DECLARED working-directory;
    # without this it looked under scripts/ci/go and never saved).
    # The `pwd` probes the nested cwd rule; keep it until the save is
    # proven, then reduce to `true`. DO NOT REMOVE this step without
    # re-proving post-save.
    - name: anchor cache post cwd (probe)
      shell: bash
      working-directory: ${{ github.workspace }}
      run: pwd
